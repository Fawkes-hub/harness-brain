[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-brain"
description = "Git-native shared memory for every AI coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "harness-brain contributors" }]
keywords = ["ai-agents", "agent-memory", "knowledge-base", "markdown", "mcp", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database :: Front-Ends",
  "Topic :: Software Development :: Documentation",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/__OWNER__/harness-brain"
Documentation = "https://github.com/__OWNER__/harness-brain/tree/main/docs"
Changelog = "https://github.com/__OWNER__/harness-brain/blob/main/CHANGELOG.md"
Issues = "https://github.com/__OWNER__/harness-brain/issues"

[tool.setuptools]
packages = ["brainlib"]
script-files = ["bin/brain"]

[tool.setuptools.dynamic]
version = { attr = "brainlib.__version__" }
